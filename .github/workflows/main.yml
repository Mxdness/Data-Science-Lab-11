name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        run: pip install uv

      - name: Setup dependencies
        run: make setup

      - name: Run pipeline
        run: make pipeline

      - name: Run tests
        run: make test
